# Source registry: the single source of truth for what SportsBot collects.
# Loaded by sportsbot_pipelines.collectors.registry and mirrored into the `sources` table.
#
# Rules (README "Data sources", AGENTS.md):
# - RSS and official APIs first; page extraction only where robots.txt and the terms allow it.
# - `verified` is set to true only after `python -m sportsbot_pipelines sources check` fetched the
#   feed successfully; record the date in `notes`. Unverified sources still run, and their failures
#   are recorded in collection_runs.
# - `domains`: article links outside these domains are dropped (from the prototype, PR #1).
# - Full text is for internal processing only; users see title, excerpt and link.

sources:
  # --- Vietnamese ---------------------------------------------------------------
  - id: vnexpress_the_thao
    name: VnExpress Thể thao
    kind: rss
    url: https://vnexpress.net/rss/the-thao.rss
    language: vi
    interval_minutes: 30
    timezone: Asia/Ho_Chi_Minh
    domains: [vnexpress.net]
    verified: true
    notes: "Used by the prototype (PR #1). Live check 2026-11-02 from Vietnam (TMK, macOS): 60 entries, all dated with offsets. From a GitHub runner in the US the feed returns HTTP 404, so collect from Vietnam."

  - id: tuoitre_the_thao
    name: Tuổi Trẻ Thể thao
    kind: rss
    url: https://tuoitre.vn/rss/the-thao.rss
    language: vi
    interval_minutes: 30
    timezone: Asia/Ho_Chi_Minh
    domains: [tuoitre.vn]
    verified: true
    notes: "Used by the prototype (PR #1). Live check 2026-11-02: 50 entries. Dates are US month-first with AM/PM and no offset (e.g. 11/2/2026 1:35:00 PM); parsed by collectors/dates.py with Asia/Ho_Chi_Minh assumed."

  # --- English ------------------------------------------------------------------
  - id: bbc_sport_football
    name: BBC Sport Football
    kind: rss
    url: https://feeds.bbci.co.uk/sport/football/rss.xml
    language: en
    interval_minutes: 30
    timezone: Europe/London
    domains: [bbc.co.uk, bbc.com]
    verified: true
    notes: "Live check 2026-11-02: 74 entries, 68 usable, all dated. Summaries only."

  - id: bbc_sport_tennis
    name: BBC Sport Tennis
    kind: rss
    url: https://feeds.bbci.co.uk/sport/tennis/rss.xml
    language: en
    interval_minutes: 60
    timezone: Europe/London
    domains: [bbc.co.uk, bbc.com]
    verified: true
    notes: "Live check 2026-11-02: 55 entries, all usable and dated."

  - id: bbc_sport_basketball
    name: BBC Sport Basketball
    kind: rss
    url: https://feeds.bbci.co.uk/sport/basketball/rss.xml
    language: en
    interval_minutes: 60
    timezone: Europe/London
    domains: [bbc.co.uk, bbc.com]
    verified: true
    notes: "Live check 2026-11-02: 17 entries, all usable and dated."

  - id: guardian_football
    name: The Guardian Football
    kind: rss
    url: https://www.theguardian.com/football/rss
    language: en
    interval_minutes: 60
    timezone: Europe/London
    domains: [theguardian.com]
    verified: true
    notes: "Live check 2026-11-02: 59 entries, all usable and dated."

  # --- Spanish ------------------------------------------------------------------
  - id: marca_futbol
    name: MARCA Fútbol
    kind: rss
    url: https://e00-marca.uecdn.es/rss/futbol.xml
    language: es
    interval_minutes: 60
    timezone: Europe/Madrid
    domains: [marca.com]
    verified: true
    notes: "Live check 2026-11-02: 47 entries, all usable and dated."

  # --- French -------------------------------------------------------------------
  - id: lequipe_actu
    name: L'Équipe Actualités
    kind: rss
    url: https://www.lequipe.fr/rss/actu_rss.xml
    language: fr
    interval_minutes: 60
    timezone: Europe/Paris
    enabled: false
    domains: [lequipe.fr]
    verified: false
    notes: "Live check 2026-11-02: HTTP 403 (access refused). Disabled: we do not work around refusals. A French replacement source is still needed."
