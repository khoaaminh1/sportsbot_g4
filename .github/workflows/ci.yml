name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit/contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pipelines/requirements.txt
            agent/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r backend/requirements.txt -r pipelines/requirements.txt -r agent/requirements.txt
      - name: Validate source registry
        run: PYTHONPATH=pipelines/src python -m sportsbot_pipelines sources validate
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and contract tests
        run: python -m pytest

  stack:
    name: Docker stack smoke test (HDFS, Spark, PostgreSQL, Qdrant, backend)
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile core --profile bigdata --profile collect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
            pipelines/requirements.txt
            agent/requirements.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt -r backend/requirements.txt -r pipelines/requirements.txt -r agent/requirements.txt
      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "STACK_HDFS_WEBHDFS_URL=http://namenode:9870" >> .env
      - name: Validate compose file
        run: $COMPOSE config --quiet
      - name: Start HDFS and Spark
        run: $COMPOSE up -d --wait namenode datanode1 datanode2 spark-master spark-worker
      - name: Create HDFS layout
        run: $COMPOSE run --rm hdfs-init
      - name: HDFS report (live DataNodes, capacity)
        run: $COMPOSE exec -T namenode hdfs dfsadmin -report | head -n 40
      - name: Spark job writes and reads Parquet on HDFS
        run: |
          $COMPOSE exec -T spark-master /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            /opt/sportsbot/pipelines/spark/jobs/hdfs_smoke.py 2>&1 | tee spark-smoke.log
          grep -q '"ok": true' spark-smoke.log
      - name: Spark MLlib (pyspark.ml + numpy) on the driver and executors (task 7)
        run: |
          $COMPOSE exec -T spark-master /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            /opt/sportsbot/pipelines/spark/jobs/ml_check.py 2>&1 | tee ml-check.log
          grep -q '"ok": true' ml-check.log
      - name: Check block replication of the smoke output
        run: $COMPOSE exec -T namenode hdfs fsck /sportsbot/_smoke -files -blocks | tail -n 25
      - name: Start PostgreSQL, Qdrant and backend
        run: $COMPOSE up -d --build --wait postgres qdrant backend
      - name: Integration tests against the running stack
        env:
          SPORTSBOT_INTEGRATION: "1"
          EXPECT_HDFS: "1"
        run: python -m pytest -m integration -v
      - name: Collector end to end (synthetic fixture feed -> HDFS Bronze -> PostgreSQL)
        run: |
          $COMPOSE up -d --wait fixture-feed
          RUN="$COMPOSE run --rm --build -e SOURCES_FILE=/fixtures/sources_fixture.yaml -e MIN_SECONDS_BETWEEN_REQUESTS_PER_HOST=0 -v ./pipelines/tests/fixtures:/fixtures:ro collector collect"
          $RUN | tee collect1.log
          grep -q '"items_new": 3' collect1.log
          $RUN | tee collect2.log
          grep -q '"items_new": 0' collect2.log
      - name: Bronze in HDFS and runs in PostgreSQL
        run: |
          $COMPOSE exec -T namenode hdfs dfs -ls -R /sportsbot/bronze/source=fixture_vi
          LINES=$($COMPOSE exec -T namenode bash -c 'hdfs dfs -text "/sportsbot/bronze/source=fixture_vi/*/*/*.jsonl.gz" | wc -l')
          echo "Bronze lines: $LINES"
          test "$LINES" -eq 3
          $COMPOSE exec -T postgres psql -U sportsbot -d sportsbot -c \
            "SELECT source_id, status, http_status, items_fetched, items_new, items_dropped FROM collection_runs ORDER BY run_id"
      - name: Streaming pipeline end to end (RSS -> Kafka -> extractor -> PostgreSQL, synthetic)
        env:
          S: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile core --profile bigdata --profile stream --profile collect
        run: |
          $S up -d --wait kafka
          $S run --rm kafka-init | tee topics.log
          grep -q articles.extracted topics.log
          FIX="-e SOURCES_FILE=/fixtures/sources_stream_fixture.yaml -e MIN_SECONDS_BETWEEN_REQUESTS_PER_HOST=0 -v ./pipelines/tests/fixtures:/fixtures:ro"
          $S run --rm --build $FIX discover discover --once | tee discover.log
          grep -q '"items_new": 2' discover.log
          $S up -d --build extractor consumer-operational
          N=0
          for i in $(seq 1 45); do
            N=$($S exec -T postgres psql -U sportsbot -d sportsbot -tAc "SELECT count(*) FROM articles WHERE source_id = 'fixture_stream'")
            [ "$N" -ge 1 ] && break
            sleep 2
          done
          echo "articles stored: $N"
          test "$N" -eq 1
          $S exec -T postgres psql -U sportsbot -d sportsbot -c "SELECT title, word_count, published_at, left(content, 80) FROM articles WHERE source_id = 'fixture_stream'"
          $S exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server kafka:9092 \
            --topic articles.dead-letter --from-beginning --max-messages 1 --timeout-ms 30000 | tee dead.log
          grep -q http_404 dead.log
      - name: Streaming worker logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile core --profile bigdata --profile stream --profile collect logs --no-color --tail 60 extractor consumer-operational kafka || true
      - name: Live check of real sources (informational, does not fail CI)
        continue-on-error: true
        run: $COMPOSE run --rm --no-deps collector sources check
      - name: Memory use per service
        if: always()
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile core --profile bigdata --profile collect --profile stream down -v
