name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and unit/contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r backend/requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and contract tests
        run: python -m pytest

  stack:
    name: Docker stack smoke test (HDFS, Spark, PostgreSQL, Qdrant, backend)
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 30
    env:
      COMPOSE: docker compose --profile core --profile bigdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt -r backend/requirements.txt
      - name: Prepare .env
        run: |
          cp .env.example .env
          echo "STACK_HDFS_WEBHDFS_URL=http://namenode:9870" >> .env
      - name: Validate compose file
        run: $COMPOSE config --quiet
      - name: Start HDFS and Spark
        run: $COMPOSE up -d --wait namenode datanode1 datanode2 spark-master spark-worker
      - name: Create HDFS layout
        run: $COMPOSE run --rm hdfs-init
      - name: HDFS report (live DataNodes, capacity)
        run: $COMPOSE exec -T namenode hdfs dfsadmin -report | head -n 40
      - name: Spark job writes and reads Parquet on HDFS
        run: |
          $COMPOSE exec -T spark-master /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            /opt/sportsbot/pipelines/spark/jobs/hdfs_smoke.py 2>&1 | tee spark-smoke.log
          grep -q '"ok": true' spark-smoke.log
      - name: Check block replication of the smoke output
        run: $COMPOSE exec -T namenode hdfs fsck /sportsbot/_smoke -files -blocks | tail -n 25
      - name: Start PostgreSQL, Qdrant and backend
        run: $COMPOSE up -d --build --wait postgres qdrant backend
      - name: Integration tests against the running stack
        env:
          SPORTSBOT_INTEGRATION: "1"
          EXPECT_HDFS: "1"
        run: python -m pytest -m integration -v
      - name: Memory use per service
        if: always()
        run: docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"
      - name: Service logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: $COMPOSE down -v
