name: Bootstrap project (labels and milestones)

# Run once by hand from the Actions tab (it changes repository labels and milestones).
# Safe to re-run: existing labels and milestones are updated, not duplicated.
# Milestones have no due dates until the team confirms the course deadline.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'area:infra', color: '6f42c1', description: 'Docker, CI, environment, PostgreSQL' },
              { name: 'area:data', color: '1d76db', description: 'Collectors, HDFS, Spark, dedup, exports' },
              { name: 'area:ml', color: 'b60205', description: 'Datasets, labels, classifiers' },
              { name: 'area:nlp', color: 'd93f0b', description: 'Language ID, segmentation, NER, time parsing' },
              { name: 'area:retrieval', color: '5319e7', description: 'BM25, vectors, hybrid search' },
              { name: 'area:agent', color: '0e8a16', description: 'Query understanding, RAG, prompts, LLM' },
              { name: 'area:backend', color: 'fbca04', description: 'FastAPI service' },
              { name: 'area:frontend', color: 'f9d0c4', description: 'Web UI' },
              { name: 'area:evaluation', color: 'c2e0c6', description: 'Golden set, metrics, reports' },
              { name: 'area:docs', color: '0075ca', description: 'Docs, contracts, ADRs' },
              { name: 'type:task', color: 'c5def5', description: 'Planned unit of work' },
              { name: 'type:bug', color: 'd73a4a', description: 'Defect' },
              { name: 'priority:P0', color: 'b60205', description: 'Blocks other work' },
              { name: 'priority:P1', color: 'ff9f1c', description: 'Needed this phase' },
              { name: 'priority:P2', color: 'cfd3d7', description: 'Nice to have' },
              { name: 'status:blocked', color: '000000', description: 'Waiting on a dependency or decision' },
            ];
            for (const l of labels) {
              try {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
              } catch (e) {
                if (e.status !== 422) throw e;
                await github.rest.issues.updateLabel({ ...context.repo, ...l });
              }
            }
            const milestones = [
              ['Phase 2 - Core infrastructure', 'Docker stack, PostgreSQL, HDFS, Spark, CI, contracts'],
              ['Phase 3 - Data engineering', 'Collectors, Bronze/Silver/Gold on HDFS, dedup, scaling experiments'],
              ['Phase 4 - AI, ML and NLP', 'Classifiers, NLP pipeline, multilingual retrieval, RAG, evaluation'],
              ['Phase 5 - Backend', 'FastAPI endpoints, conversations, integration tests, 13 completion criteria'],
              ['Phase 6 - Frontend', 'Chat, feed, search, filters, article pages'],
              ['Phase 7 - Testing and deployment', 'End-to-end, load, pipeline tests, Docker deployment'],
              ['Phase 8 - Documentation', 'Guides, experiment reports, final report'],
            ];
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              ...context.repo, state: 'all', per_page: 100,
            });
            for (const [title, description] of milestones) {
              const found = existing.find((m) => m.title === title);
              if (found) {
                await github.rest.issues.updateMilestone({ ...context.repo, milestone_number: found.number, description });
              } else {
                await github.rest.issues.createMilestone({ ...context.repo, title, description });
              }
            }
