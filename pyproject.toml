# Shared tool configuration for all Python modules (ruff, pytest).
# Each module keeps its own runtime dependencies in <module>/requirements.txt.

[project]
name = "sportsbot-g4"
version = "0.2.0"
description = "Vietnam SportsBot: real-time multilingual sports news chatbot (Big Data course, Group 4)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "sportsbot_pipelines", "sportsbot_agent"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "pipelines/tests", "agent/tests", "tests"]
pythonpath = ["backend/src", "backend/tests", "pipelines/src", "agent/src", "evaluation"]
addopts = "-ra"
markers = [
    "integration: needs the running Docker stack (set SPORTSBOT_INTEGRATION=1)",
]
